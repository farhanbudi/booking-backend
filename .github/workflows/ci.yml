name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# Satu eksekusi per kombinasi workflow+ref. Push baru untuk ref yang sama
# membatalkan eksekusi lama supaya PR tidak menunggu dua run paralel.
# Job `ci-success` tetap mengevaluasi hasilnya sebagai gagal.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (typecheck + test)
    runs-on: ubuntu-latest

    # Test suite memakai PostgreSQL sungguhan, bukan mock: exclusion constraint
    # `no_overlapping_bookings` dan test race condition hanya berarti sesuatu kalau
    # benar-benar dieksekusi terhadap database asli.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: booking_test
        ports:
          - "5432:5432"
        # Healthcheck membuat Actions menunggu sampai database siap, tanpa polling loop.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # Semua nilai di bawah adalah dummy dan sengaja ditulis openly di dalam workflow.
    # Jangan pernah memindahkan nilai produksi ke sini.
    # 127.0.0.1 (bukan localhost) menghindari ketergantungan pada resolusi IPv6 di runner Linux.
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/booking_test
      JWT_SECRET: ci-dummy-jwt-secret-bukan-rahasia
      PORT: "3001"
      RUN_MODE: all
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      REDIS_URL: redis://127.0.0.1:6379/15
      MAIL_PROVIDER: smtp
      MAIL_FROM: Booking App <no-reply@example.com>
      SMTP_HOST: localhost
      SMTP_PORT: "1025"
      STRIPE_SECRET_KEY: sk_test_ci_dummy_key
      STRIPE_WEBHOOK_SECRET: whsec_ci_dummy_secret
      PAYMENT_CURRENCY: idr
      ACCESS_TOKEN_TTL_MINUTES: "15"
      REFRESH_TOKEN_TTL_DAYS: "30"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependency
        run: bun install --frozen-lockfile

      # `tests/setup.ts` (preload) memanggil loadTestEnvFile() yang melempar error
      # kalau berkas .env.test tidak ada, dan isinya MENIMPA process.env. Karena itu
      # env di atas harus ditulis ulang ke .env.test — bukan hanya Andal pada env job.
      # Nama database mengandung "test" karena assertTestDatabaseUrl() mewajibkannya.
      - name: Tulis .env.test dari environment job
        run: |
          {
            echo "NODE_ENV=test"
            for k in DATABASE_URL JWT_SECRET PORT RUN_MODE CORS_ALLOWED_ORIGINS \
                     REDIS_URL MAIL_PROVIDER MAIL_FROM SMTP_HOST SMTP_PORT \
                     STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET PAYMENT_CURRENCY \
                     ACCESS_TOKEN_TTL_MINUTES REFRESH_TOKEN_TTL_DAYS; do
              echo "$k=${!k}" >> .env.test
            done
          }
          cat .env.test

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

  # Satu-satunya status check yang direkomendasikan untuk branch protection `main`.
  # Job ini TIDAK memakai `container:` supaya tidak menarik image postgres kedua
  # hanya untuk satu baris pemeriksaan.
  ci-success:
    name: CI Success
    if: always()
    needs:
      - backend
    runs-on: ubuntu-latest
    steps:
      # `if: always()` wajib (bukan `success()`), kalau tidak job ini akan ter-skip
      # saat job `backend` gagal — dan status check yang ter-skip akan menggantung PR.
      - name: Pastikan semua job wajib sukses
        run: |
          if [ "${{ needs.backend.result }}" != "success" ]; then
            echo "Job backend selesai dengan hasil: ${{ needs.backend.result }}"
            exit 1
          fi
          echo "Semua job CI sukses."